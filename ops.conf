# ops.conf for the standby server: Oracle Cloud VM.Standard.E2.1.Micro
# (1/8 OCPU, 1 GB, x86). It watches the main server and stores its backups.
# No secrets here; those live in /etc/ops on the server.

OPS_HOST=standby

# Small on purpose: this machine only runs Gatus.
RESOURCE_BUDGET_CPUS=0.5
RESOURCE_BUDGET_MEM=512m

BACKUP_TIME="30 19 * * *"
CHECK_TIME="0 21 * * 0"

DEPLOY_USER=
